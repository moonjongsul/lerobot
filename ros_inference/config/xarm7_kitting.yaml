# ros_inference — xarm7 kitting rollout (eef twist 제어).
#
# 토픽·단위·스케일은 max_data_collect(demo_data_collect_config.yaml)가 녹화한
# 것과 정확히 같아야 한다. 정책은 그 녹화를 보고 학습했으므로 여기서 하나라도
# 어긋나면(프레임, 단위, 카메라 매핑) 정책은 에러 없이 엉뚱하게 움직인다.

policy:
  # pretrained_model 디렉토리 또는 그 상위 체크포인트 디렉토리
  checkpoint: /workspace/m.ax/checkpoints/mvla_xarm7_eef_velocity_s4_split_H200_b90x4_260923/050000
  device: cuda
  # MVLA: 목표 이름 (kit | pick | place). 프롬프트는 플래너가 중립 문장으로 만든다.
  # SmolVLA: 학습 때의 문장 그대로 (예: "pick up the black plastic object, move it
  #          to the white tray, and place it in the tray").
  task: kit
  # flow-matching denoising 스텝. null이면 체크포인트 값(10).
  num_inference_steps: null

control:
  fps: 30.0                 # 녹화 주기. 액션 한 스텝 = 1/fps 초
  # 청크(50스텝 = 1.67초) 중 다음 청크로 넘어가기 전까지 실행할 스텝 수.
  # 새 청크 요청은 추론 지연만큼 앞당겨 보낸다.
  execute_steps: 25
  # 새 청크가 도착했을 때 이전 청크에서 넘어가는 선형 혼합 스텝 수
  blend_steps: 5
  max_episode_s: 180.0
  # 관측이 이보다 오래되면 즉시 정지 명령 (카메라/상태 토픽 끊김)
  stale_timeout_s: 0.3
  # vc_set_cartesian_velocity의 duration. 이 시간 안에 다음 명령이 없으면
  # 컨트롤러가 스스로 멈춘다 -- 노드가 죽거나 멈췄을 때의 워치독.
  command_duration_s: 0.2

safety:
  # 모든 속도에 곱한다. 첫 실기는 0.3~0.5로 시작할 것.
  speed_scale: 0.5
  # 축별 절대 상한. 데이터셋 action의 min/max(±0.25 m/s, ±0.6 rad/s)와 같다.
  max_linear: 0.25          # m/s
  max_angular: 0.6          # rad/s
  # 틱 사이 변화량 제한 (청크 전환 시 튐 방지)
  max_linear_accel: 1.5     # m/s^2
  max_angular_accel: 4.0    # rad/s^2
  # TCP 위치 박스 (xarm_base, m). 경계 밖으로 향하는 성분만 0으로 만든다.
  # 전체 프레임 eef 위치의 0.1..99.9 퍼센타일 = x[-0.30,0.63] y[-0.59,0.10]
  # z[0.00,0.34]에 약간의 여유. (stats.json의 q01/q99는 에피소드별 평균이라
  # 훨씬 좁게 나와 쓰면 안 된다 -- flip 도중 x=-0.11까지 간다.)
  # z 하한은 테이블 높이 기준으로 셀에서 실측 후 조정할 것.
  workspace_min: [-0.32, -0.61, 0.0]
  workspace_max: [0.65, 0.12, 0.35]
  # 그리퍼 명령은 0/1로 녹화됐다. 정책 출력을 이 임계와 히스테리시스로 이진화.
  gripper_threshold: 0.5
  gripper_hysteresis: 0.15

mvla:
  # 시작 상태. 먼저 그리퍼 effort로 파지 여부를 본다. 아니면
  #   auto       = 인식기가 있으면 recognizer, 없으면 head
  #   recognizer = 인식기 mat 판정 (target / flipped / empty / abstain)
  #   head       = subtask 헤드의 approach_flip vs approach_pick 확률
  #   target | flipped | in_gripper = 고정
  initial_state: auto
  holding_effort: 0.3       # 정규화 effort가 이 이상이면 파지 중으로 본다
  # 헤드가 다음 subtask를 이만큼 연속 예측해야 넘어간다
  hysteresis: 2
  # 청크 사이 헤드 단독 읽기 주기 (value 정체 감시용)
  head_hz: 5.0
  # 헤드를 읽을 프롬프트. self = 정책과 같은 프롬프트, blind = 과제 문장만.
  # 폐루프 평가(val 58개, 경계 201개)에서 둘 다 추적 정확도 0.90, 경계 놓침
  # 1~1.5%로 같고, self가 헛넘김이 적다(50k: 104 vs 120). self가 자기 subtask를
  # 베껴 멈추는 일은 없었다.
  head_prompt: self
  # Speed 필드. null이면 생략한다(학습 때 필드 dropout으로 본 형태).
  # 15퍼센타일(500)은 전체 과제에 비해 비현실적으로 짧아 분포 밖이다.
  speed_bin: null
  # 메인 prompt 작업 종료 판단. plan의 마지막 subtask에서만 보고, 아래 둘 중
  # 하나가 연속 N회면 종료. 근거: eval_termination (.claude/260929.md)
  completion_value_subtask: -0.05   # -0.10이면 발동 97%지만 p10이 place 도중(-7s)
  completion_value_episode: -0.05
  completion_consecutive: 3

recognizer:
  # 상태 인식기 (DINOv2 + 선형 probe). 비우면 인식기 없이 돈다.
  # train 234개로만 학습한 모델: held-out val mat 96.6% / tray AUC 0.987
  path: /workspace/m.ax/checkpoints/mvla_recognizer_split_260923
  device: cuda
  verify_flip: true          # flip 후 mat 판정이 flipped가 아니면 approach_flip부터 재계획
  verify_place: true         # 놓은 뒤 tray 판정: ok -> 작업 완료, bad -> approach_pick부터 재시도
  # 캡처 시각은 인식기 학습 샘플과 같아야 한다 (recognizer/dataset.py)
  start_offsets_s: [0.1, 0.4, 0.7]
  flip_offsets_frames: [3, 12, 21]
  release_offsets_frames: [8, 18, 28]
  release_rise: 0.15         # place 중 그리퍼 위치가 최저값에서 이만큼 오르면 릴리스
  unverified_timeout_s: 5.0  # 정책은 끝났다는데 릴리스가 안 보이면 이만큼 뒤 검증 없이 완료
  # tray P(bad) 임계. 0.3 = 설계 권장(놓친 불량 최소화, 오경보 1회 = 재파지 ~20초).
  # held-out val(bad 7건): 0.3 -> 6/7 탐지·오경보 2 / 0.5 -> 6/7·오경보 0
  tray_bad_threshold: 0.3

ros:
  qos_depth: 10
  cameras:                  # 데이터셋 카메라 키 -> 토픽. 이름이 학습 때와 같아야 한다
    env: /observation/env/color/image_raw/compressed
    wrist_front: /observation/wrist_front/color/image_raw/compressed
    wrist_rear: /observation/wrist_rear/color/image_raw/compressed
  image_size: [640, 480]    # [w, h] 녹화 해상도. 다르면 INTER_AREA로 맞춘다
  image_rotate: {env: 0, wrist_front: 0, wrist_rear: 0}
  eef_pose: /xarm/eef_pose
  eef_twist: /xarm/eef_twist
  expected_frame_id: xarm_base
  gripper_state: /dxl_parallel_gripper/joint_states
  gripper_joint: finger_joint
  gripper_effort_max: 600.0

  # 명령 경로 -- teleop 노드와 같은 것을 쓴다
  velocity_service: /xarm/vc_set_cartesian_velocity   # xarm_msgs/srv/MoveVelocity (mm/s, rad/s)
  set_mode_service: /xarm/set_mode                    # xarm_msgs/srv/SetInt16
  set_state_service: /xarm/set_state                  # xarm_msgs/srv/SetInt16
  setup_velocity_mode: true                           # 시작 시 mode 5 + state 0
  gripper_command: /gripper/gripper_client/target_gripper_width_percent   # std_msgs/Float32

  # 녹화 연동. 레코더의 action.topic을 이 토픽으로 두면 rollout이 데모와
  # 같은 스키마로 쌓인다 (config/rollout_data_collect_config.yaml 참고).
  rollout_action_topic: /data_collection/rollout_action   # max_interfaces/msg/TeleopAction
  record_service: /data_collection/record_command         # max_interfaces/srv/RecordCommand
  auto_record: true          # 에피소드 시작/끝에 레코더 START / SAVE
  status_topic: /ros_inference/status                     # std_msgs/String (JSON)
  task_complete_topic: /ros_inference/task_complete       # std_msgs/String (JSON), latched

log_dir: /workspace/m.ax/rollout_logs
